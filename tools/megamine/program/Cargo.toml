[package]
name = "megamine"
version = "0.1.0"
edition = "2021"
description = "MEGAMINE: million-voxel mining war composed on uponly curves. Factions are uponly tokens; digs burn NAV-value; vein strikes donate to the faction floor. No admin keys — every parameter is burned at init."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.1.0"
borsh = "1.5.1"

[dev-dependencies]
litesvm = "0.6"
solana-sdk = "^2.1"
spl-token = { version = "^4", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "^6", features = ["no-entrypoint"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace]
[features]
mini = []
